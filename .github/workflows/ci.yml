name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify module downloads
        run: go mod verify
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build commands and examples
        run: make build
      - name: CLI smoke
        run: ./bin/sber --help
      - name: Set Firefox test paths
        shell: bash
        run: |
          sber_firefox_root="$RUNNER_TEMP/sber-firefox"
          printf 'PLAYWRIGHT_DRIVER_PATH=%s/driver\n' "$sber_firefox_root" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' "$sber_firefox_root" >> "$GITHUB_ENV"
          printf 'SBER_GO_FIREFOX_DRIVER=%s/driver\n' "$sber_firefox_root" >> "$GITHUB_ENV"
          printf 'SBER_GO_BROWSER_PROBE_ROOT=%s/profiles\n' "$sber_firefox_root" >> "$GITHUB_ENV"
      - name: Install Firefox test runtime on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps firefox
      - name: Install Firefox test runtime on macOS
        if: runner.os == 'macOS'
        run: |
          brew install nss
          go run github.com/mxschmitt/playwright-go/cmd/playwright install firefox
      - name: Native Firefox TLS and proxy tests
        shell: bash
        run: |
          mkdir -p "$SBER_GO_BROWSER_PROBE_ROOT"
          chmod 0700 "$SBER_GO_BROWSER_PROBE_ROOT"
          sber_firefox_executable=$(rg --files --hidden --no-ignore "$PLAYWRIGHT_BROWSERS_PATH" | rg '/firefox$')
          sber_certutil=$(command -v certutil || true)
          if [ -z "$sber_certutil" ]; then
            sber_certutil="$(brew --prefix nss)/bin/certutil"
          fi
          SBER_GO_FIREFOX_EXECUTABLE="$sber_firefox_executable" SBER_GO_CERTUTIL="$sber_certutil" \
            go test -race -tags=browser_integration ./browser
